SpeciesEntity:
  type: object
  description: Species master
  properties:
    species_id:
      type: string
      description: Species id
    japanese_name:
      type: string
      description: Japanese name
    common_name:
      type: string
      description: Common name
    english_name:
      type: string
      description: English name
    total_length:
      type: string
      description: Total length
    body_weight:
      type: string
      description: Body weight
    lifespan:
      type: string
      description: Lifespan

IndividualImageEntity:
  type: object
  description: Individual image
  properties:
    image_id:
      type: integer
      format: int64
    species_id:
      type: string
    individual_id:
      type: string
    storage_path:
      type: string
    public_url:
      type: string
    file_name:
      type: string
    content_type:
      type: string
    file_size:
      type: integer
      format: int64
    sort_order:
      type: integer
      format: int32
    is_primary:
      type: boolean
    created_at:
      type: string
      format: date-time
    created_by:
      type: string
    updated_at:
      type: string
      format: date-time
    updated_by:
      type: string

PairingEntity:
  type: object
  description: Pairing
  properties:
    species_id:
      type: string
      maxLength: 20
    fiscal_year:
      type: integer
      format: int32
    pairing_id:
      type: string
      maxLength: 20
    male_parent_id:
      type: string
      maxLength: 20
    female_parent_id:
      type: string
      maxLength: 20
    pairing_date:
      type: string
      format: date
    note:
      type: string
      maxLength: 255

IndividualMorph:
  type: object
  description: Individual morph entry
  properties:
    morph_id:
      type: string
      maxLength: 20
    morph_name:
      type: string
      maxLength: 100
    bloodline_id:
      type: string
      maxLength: 20
    bloodline_name:
      type: string
      maxLength: 100
    expression_category:
      type: string
      maxLength: 1
    possible_het_percentage:
      type: integer
      format: int32
    sort_order:
      type: integer
      format: int32

Individual:
  type: object
  description: Individual
  properties:
    species_id:
      type: string
      maxLength: 20
    fiscal_year:
      type: integer
      format: int32
    id:
      type: string
      maxLength: 20
    pairing_fiscal_year:
      type: integer
      format: int32
    pairing_id:
      type: string
      maxLength: 20
    male_parent_id:
      type: string
      maxLength: 20
    female_parent_id:
      type: string
      maxLength: 20
    morph_entries:
      type: array
      items:
        $ref: '#/components/schemas/IndividualMorph'
    gender_category:
      type: string
      maxLength: 1
    breeding_category:
      type: string
      maxLength: 1
    breeder:
      type: string
      maxLength: 20
    clutch_date:
      type: string
      format: date
    hatch_date:
      type: string
      format: date
    purchase_from:
      type: string
    purchase_price:
      type: number
      format: double
    purchase_date:
      type: string
      format: date
    sales_category:
      type: string
    sales_to:
      type: string
    sales_price_tax_ex:
      type: number
      format: double
    sales_price_tax:
      type: number
      format: double
    sales_price_tax_in:
      type: number
      format: double
    sales_date:
      type: string
      format: date
    death_date:
      type: string
      format: date
    note:
      type: string
      maxLength: 255
    create_user:
      type: string
      maxLength: 20
    create_at:
      type: string
      format: date-time
    update_user:
      type: string
      maxLength: 20
    update_at:
      type: string
      format: date-time
  required:
    - species_id
    - fiscal_year
